<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTURN Calendar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        plum: { DEFAULT: '#714B67', hover: '#5d3d54', light: '#f5eff4' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overscroll-behavior: none; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #e2e8f0;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            overflow: hidden;
            flex-grow: 1;
        }
        
        .calendar-cell {
            background-color: #ffffff;
            min-height: 100px;
            padding: 6px;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        @media (min-width: 768px) {
            .calendar-cell { min-height: 130px; padding: 8px; }
        }
        
        .calendar-cell:hover { background-color: #f8fafc; }
        
        .calendar-day-header {
            background-color: #f1f5f9;
            text-align: center;
            padding: 10px 0;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .event-pill {
            font-size: 10.5px;
            padding: 3px 6px;
            border-radius: 4px;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 3px solid transparent;
            transition: opacity 0.2s;
        }
        .event-pill:hover { opacity: 0.8; }
        
        /* Hide scrollbars but allow scrolling */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 flex items-center justify-between shrink-0 shadow-sm z-20 relative">
        <div class="flex items-center gap-3 sm:gap-4">
            <!-- Back to Dashboard -->
            <a href="index.html" class="flex items-center gap-2 text-slate-700 hover:text-plum transition group">
                <div class="w-8 h-8 rounded-lg bg-plum text-white flex items-center justify-center font-bold text-lg shadow-sm group-hover:bg-plum-hover">
                    N
                </div>
                <div class="hidden sm:flex items-baseline gap-1">
                    <span class="font-bold text-lg tracking-tight">NTURN</span>
                    <span class="font-medium text-sm text-plum">Projects</span>
                </div>
            </a>
            <div class="h-6 w-px bg-slate-200 hidden sm:block mx-1"></div>
            <!-- App Title -->
            <div class="flex items-center gap-2 text-slate-800">
                <div class="w-7 h-7 rounded-lg bg-red-100 text-red-600 flex items-center justify-center text-sm shadow-xs">
                    <i class="fa-regular fa-calendar"></i>
                </div>
                <h1 class="font-semibold text-base sm:text-lg tracking-tight">Calendar</h1>
            </div>
        </div>
        
        <div class="flex items-center gap-2 sm:gap-3">
            <div class="hidden md:flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-100 text-emerald-700 text-xs font-medium mr-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Saved locally
            </div>
            
            <!-- Upcoming Events Drawer Toggle -->
            <button onclick="openDrawer()" class="w-9 h-9 flex items-center justify-center text-slate-500 hover:text-plum hover:bg-slate-100 rounded-full transition relative" title="Upcoming Events">
                <i class="fa-regular fa-bell text-lg"></i>
                <span id="upcomingBadge" class="absolute top-0 right-0 w-3.5 h-3.5 bg-rose-500 border-2 border-white rounded-full hidden"></span>
            </button>

            <!-- New Event Button -->
            <button onclick="openEventModal()" class="px-3 sm:px-4 py-2 bg-plum hover:bg-plum-hover text-white text-sm font-semibold rounded-lg shadow-sm transition flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">New Event</span>
            </button>
        </div>
    </header>

    <!-- Main Calendar Workspace -->
    <main class="flex-1 flex flex-col p-2 sm:p-5 bg-slate-50 overflow-hidden relative" id="calendarSwipeArea">
        
        <!-- Calendar Controls -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3 shrink-0 px-1">
            <div class="flex items-center justify-between w-full sm:w-auto gap-4">
                <h2 id="currentMonthLabel" class="text-xl sm:text-2xl font-bold text-slate-800">Month 2026</h2>
                
                <div class="flex items-center bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm">
                    <button onclick="changeMonth(-1)" class="px-3 py-1.5 text-slate-600 hover:bg-slate-50 border-r border-slate-200 transition"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="resetToToday()" class="px-3 py-1.5 text-xs sm:text-sm font-semibold text-slate-700 hover:bg-slate-50 transition">Today</button>
                    <button onclick="changeMonth(1)" class="px-3 py-1.5 text-slate-600 hover:bg-slate-50 border-l border-slate-200 transition"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>

        <!-- 100% Width Grid -->
        <div class="calendar-grid no-scrollbar shadow-xs">
            <div class="calendar-day-header">Sun</div>
            <div class="calendar-day-header">Mon</div>
            <div class="calendar-day-header">Tue</div>
            <div class="calendar-day-header">Wed</div>
            <div class="calendar-day-header">Thu</div>
            <div class="calendar-day-header">Fri</div>
            <div class="calendar-day-header">Sat</div>
            <!-- Cells generated via JS -->
        </div>
    </main>

    <!-- RIGHT SLIDE-OUT DRAWER (Upcoming Events) -->
    <div id="drawerBackdrop" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 transition-opacity" onclick="closeDrawer()"></div>
    <div id="upcomingDrawer" class="fixed top-0 right-0 h-full w-72 sm:w-80 bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <h3 class="font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-bolt text-amber-500"></i> Upcoming Events
            </h3>
            <button onclick="closeDrawer()" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="p-5 flex-1 overflow-y-auto bg-white space-y-3" id="drawerEventsList">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- EVENT CREATION MODAL -->
    <div id="eventModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all">
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-800">Add New Event</h3>
                <button onclick="closeEventModal()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <input type="text" id="evTitle" placeholder="Event Title (e.g. Meeting)" class="w-full text-lg font-medium border-b-2 border-slate-200 pb-2 focus:outline-none focus:border-plum bg-transparent placeholder:text-slate-300">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Date</label>
                        <input type="date" id="evDate" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-plum">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Time</label>
                        <input type="time" id="evTime" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-plum">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1 uppercase tracking-wider">Color Tag</label>
                    <select id="evColor" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-plum">
                        <option value="blue">Blue (Meeting / Default)</option>
                        <option value="emerald">Green (Project Task)</option>
                        <option value="amber">Yellow (Follow-up)</option>
                        <option value="rose">Red (Urgent)</option>
                        <option value="plum">Plum (NTURN Default)</option>
                    </select>
                </div>
            </div>
            <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="closeEventModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg transition">Cancel</button>
                <button onclick="saveEvent()" class="px-4 py-2 bg-plum hover:bg-plum-hover text-white text-sm font-semibold rounded-lg shadow-sm transition">Save Event</button>
            </div>
        </div>
    </div>

    <!-- NON-BLOCKING TOAST NOTIFICATION -->
    <div id="toastContainer" class="fixed bottom-5 sm:top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Application Logic -->
    <script>
        // Storage Logic
        const STORAGE_KEY = 'nturn_calendar_data';
        let events = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        
        // Date Variables
        let currentDate = new Date(); 
        const today = new Date();     

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        const colorMap = {
            blue: 'bg-blue-50 text-blue-700 border-blue-400',
            emerald: 'bg-emerald-50 text-emerald-700 border-emerald-400',
            amber: 'bg-amber-50 text-amber-700 border-amber-400',
            rose: 'bg-rose-50 text-rose-700 border-rose-400',
            plum: 'bg-plum-light text-plum border-plum' // Uses custom tailwind config
        };

        // Swipe Gestures for Mobile
        let touchstartX = 0;
        let touchendX = 0;
        const swipeArea = document.getElementById('calendarSwipeArea');
        
        swipeArea.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});

        swipeArea.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            if (touchendX < touchstartX - 50) changeMonth(1); // Swipe left -> Next
            if (touchendX > touchstartX + 50) changeMonth(-1); // Swipe right -> Prev
        }

        // Initialize App
        window.onload = function() {
            // Pre-load events if completely empty
            if(events.length === 0) {
                const y = today.getFullYear();
                const m = String(today.getMonth() + 1).padStart(2, '0');
                const tDate = String(today.getDate()).padStart(2, '0');
                const nDate = String(today.getDate() + 2).padStart(2, '0');
                
                const todayStr = `${y}-${m}-${tDate}`;
                const nextStr = `${y}-${m}-${nDate}`;

                events = [
                    { id: 'evt_1', title: 'Product Launch Sync', date: todayStr, time: '10:00', color: 'plum' },
                    { id: 'evt_2', title: 'Client Feedback Call', date: todayStr, time: '14:30', color: 'blue' },
                    { id: 'evt_3', title: 'UI Design Review', date: nextStr, time: '11:00', color: 'emerald' }
                ];
                saveToStorage(false); // Save without toast
            }
            renderCalendar();
        };

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('currentMonthLabel').textContent = `${monthNames[month]} ${year}`;

            const firstDayOfMonth = new Date(year, month, 1).getDay(); 
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            const grid = document.querySelector('.calendar-grid');
            
            // Clear old cells
            const cells = grid.querySelectorAll('.calendar-cell');
            cells.forEach(c => c.remove());

            // Prev Month trailing
            for (let i = firstDayOfMonth - 1; i >= 0; i--) {
                const dayNum = daysInPrevMonth - i;
                grid.appendChild(createDayCell(dayNum, true, year, month - 1));
            }

            // Current Month
            for (let i = 1; i <= daysInMonth; i++) {
                const isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear());
                grid.appendChild(createDayCell(i, false, year, month, isToday));
            }

            // Next Month leading
            const totalCellsSoFar = firstDayOfMonth + daysInMonth;
            const remainingCells = (totalCellsSoFar <= 35 ? 35 : 42) - totalCellsSoFar;
            for (let i = 1; i <= remainingCells; i++) {
                grid.appendChild(createDayCell(i, true, year, month + 1));
            }

            renderDrawerList();
        }

        function createDayCell(dayNum, isFaded, year, month, isToday = false) {
            let dateObj = new Date(year, month, dayNum);
            let y = dateObj.getFullYear();
            let m = String(dateObj.getMonth() + 1).padStart(2, '0');
            let d = String(dateObj.getDate()).padStart(2, '0');
            const dateString = `${y}-${m}-${d}`; 

            const div = document.createElement('div');
            div.className = `calendar-cell flex flex-col relative group ${isFaded ? 'bg-slate-50/40 text-slate-400' : 'bg-white'}`;
            
            // Tap cell to open modal
            div.onclick = (e) => {
                if(e.target === div || e.target.classList.contains('cell-events') || e.target.classList.contains('day-number')) {
                    document.getElementById('evDate').value = dateString;
                    openEventModal();
                }
            };

            const numSpan = document.createElement('span');
            numSpan.className = `day-number text-[11px] sm:text-xs font-bold mb-1 w-6 h-6 sm:w-7 sm:h-7 flex items-center justify-center rounded-full ${isToday ? 'bg-plum text-white shadow-md' : (isFaded ? 'text-slate-300' : 'text-slate-700')}`;
            numSpan.textContent = dayNum;
            div.appendChild(numSpan);

            const eventContainer = document.createElement('div');
            eventContainer.className = 'cell-events flex-1 overflow-y-auto space-y-1 no-scrollbar';
            
            const dayEvents = events.filter(ev => ev.date === dateString);
            dayEvents.sort((a, b) => (a.time || "24:00").localeCompare(b.time || "24:00"));

            dayEvents.forEach(ev => {
                const pill = document.createElement('div');
                const colors = colorMap[ev.color] || colorMap['blue'];
                pill.className = `event-pill ${colors} shadow-2xs cursor-pointer`;
                pill.innerHTML = `<strong>${ev.time ? ev.time : ''}</strong> ${ev.title}`;
                
                // Double tap to delete
                pill.ondblclick = (e) => {
                    e.stopPropagation();
                    events = events.filter(e => e.id !== ev.id);
                    saveToStorage(true, `Deleted "${ev.title}"`);
                };
                
                eventContainer.appendChild(pill);
            });

            div.appendChild(eventContainer);
            return div;
        }

        // Drawer & Navigation Logic
        function renderDrawerList() {
            const list = document.getElementById('drawerEventsList');
            const badge = document.getElementById('upcomingBadge');
            if(!list) return;

            const todayStr = today.toISOString().split('T')[0];
            let upcoming = events.filter(ev => ev.date >= todayStr);
            
            upcoming.sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return (a.time || "24:00").localeCompare(b.time || "24:00");
            });

            // Show red dot if there are upcoming events
            if(upcoming.length > 0) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            if(upcoming.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-10">
                        <div class="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-300 text-xl"><i class="fa-regular fa-calendar-check"></i></div>
                        <p class="text-sm font-semibold text-slate-600">No upcoming events</p>
                        <p class="text-xs text-slate-400 mt-1">Tap any date to schedule one.</p>
                    </div>`;
                return;
            }

            list.innerHTML = upcoming.map(ev => {
                const colors = colorMap[ev.color] || colorMap['blue'];
                const dateObj = new Date(ev.date);
                const displayDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });

                return `
                <div class="p-3 rounded-xl border border-slate-100 bg-white flex items-start gap-3 shadow-sm">
                    <div class="w-2 h-2 rounded-full mt-1.5 shrink-0 ${colors.split(' ')[0].replace('50', '500').replace('light', '')}"></div>
                    <div>
                        <p class="text-sm font-bold text-slate-800 leading-tight">${escapeHtml(ev.title)}</p>
                        <p class="text-xs font-medium text-slate-500 mt-1">
                            <i class="fa-regular fa-clock mr-1"></i>
                            ${displayDate} ${ev.time ? '• ' + ev.time : ''}
                        </p>
                    </div>
                </div>
                `;
            }).join('');
        }

        function openDrawer() {
            document.getElementById('drawerBackdrop').classList.remove('hidden');
            document.getElementById('upcomingDrawer').classList.remove('translate-x-full');
        }

        function closeDrawer() {
            document.getElementById('drawerBackdrop').classList.add('hidden');
            document.getElementById('upcomingDrawer').classList.add('translate-x-full');
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
        }

        function resetToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        // Modal Actions
        function openEventModal() {
            document.getElementById('eventModal').classList.remove('hidden');
            if(!document.getElementById('evDate').value) {
                const todayLocal = new Date();
                todayLocal.setMinutes(todayLocal.getMinutes() - todayLocal.getTimezoneOffset());
                document.getElementById('evDate').value = todayLocal.toISOString().split('T')[0];
            }
            document.getElementById('evTitle').focus();
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
            document.getElementById('evTitle').value = '';
            document.getElementById('evDate').value = '';
            document.getElementById('evTime').value = '';
            document.getElementById('evColor').value = 'blue';
        }

        function saveEvent() {
            const title = document.getElementById('evTitle').value.trim();
            const date = document.getElementById('evDate').value;
            const time = document.getElementById('evTime').value;
            const color = document.getElementById('evColor').value;

            if(!title || !date) {
                showToast('Event title and date are required!', 'error');
                return;
            }

            events.push({
                id: 'evt_' + Date.now(),
                title, date, time, color
            });

            saveToStorage(true, `Saved "${title}"`);
            closeEventModal();
        }

        function saveToStorage(notify = false, msg = 'Saved automatically') {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
            
            // Sync with NTURN Master JSON Backup System
            try {
                let masterState = JSON.parse(localStorage.getItem('nturn_projects_master_v1'));
                if(masterState) {
                    if(!masterState.appRecords) masterState.appRecords = {};
                    masterState.appRecords['calendar'] = events.map(e => ({
                        title: e.title,
                        value: e.date,
                        date: new Date().toLocaleDateString()
                    }));
                    localStorage.setItem('nturn_projects_master_v1', JSON.stringify(masterState));
                }
            } catch (e) {}

            renderCalendar();
            if(notify) showToast(msg, 'success');
        }

        // Custom Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const colors = {
                success: 'bg-slate-800 text-white border-emerald-500',
                error: 'bg-rose-600 text-white border-white'
            };
            const icons = {
                success: 'fa-circle-check text-emerald-400',
                error: 'fa-circle-exclamation text-white'
            };

            toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border-l-4 text-xs font-semibold transition transform duration-200 ${colors[type]}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type]} text-sm"></i><span>${escapeHtml(message)}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 250);
            }, 2500);
        }

        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
